# Render blueprint — the always-on Tandem relay.
# Free "web service", native Go runtime (the free tier offers no Docker option).
# The public URL (wss://<host>) is what you hardcode into conf.BuiltInRelay.
services:
  - type: web
    name: tandem-relay
    env: image
    image: golang:1.27-bookworm
    region: singapore
    plan: free
    rootDir: app
    buildCommand: go build -trimpath -ldflags="-s -w" -o tandem ./cmd/tandem
    startCommand: ./tandem relay
    healthCheckPath: /
    autoDeploy: true
