# Render blueprint — the always-on Tandem relay.
# Mirrors the manual dashboard setup that is LIVE: https://tandem-lioc.onrender.com
# (Native Go runtime — the free tier offers no Docker/image option.)
services:
  - type: web
    name: tandem-relay
    env: go
    region: singapore
    plan: free
    rootDir: app
    buildCommand: go build -trimpath -ldflags="-s -w" -o tandem ./cmd/tandem
    startCommand: ./tandem relay
    healthCheckPath: /
    autoDeploy: true
