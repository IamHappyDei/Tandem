# Render blueprint — the always-on Tandem relay.
# Free "web service": Docker runtime, Root Directory = app, Dockerfile = app/Dockerfile.
# The public URL (wss://<host>) is what you hardcode into conf.BuiltInRelay.
services:
  - type: web
    name: tandem-relay
    env: docker
    region: singapore
    plan: free
    rootDir: app
    dockerfileDir: app
    healthCheckPath: /
    autoDeploy: true
